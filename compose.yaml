# Local development: MySQL and the build-serving nginx. Run the server with ./gradlew bootRun.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gmm
      MYSQL_USER: gmm
      MYSQL_PASSWORD: gmm
      MYSQL_ROOT_PASSWORD: root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  builds:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./data:/data/gmm:ro
      - ./deploy/nginx/builds.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      GMM_FRONTEND_ORIGIN: http://localhost:5173

volumes:
  mysql-data:
