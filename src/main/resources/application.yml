spring:
  application:
    name: gmm-server
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gmm}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:gmm}
    password: ${DB_PASSWORD:gmm}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Keep in sync with gmm.build.max-zip-size and nginx client_max_body_size.
      max-file-size: ${GMM_BUILD_MAX_ZIP_SIZE:200MB}
      max-request-size: ${GMM_BUILD_MAX_REQUEST_SIZE:210MB}
      file-size-threshold: 1MB

springdoc:
  # Off unless GMM_API_DOCS_ENABLED=true. Production turns it on, and the "front" nginx (deploy/nginx/edge.conf)
  # exposes /swagger-ui.html and /v3/api-docs on the frontend domain.
  api-docs:
    enabled: ${GMM_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${GMM_API_DOCS_ENABLED:false}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info

gmm:
  cors:
    # Leave empty when the frontend and the API share one origin behind a reverse proxy.
    allowed-origins: ${GMM_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend:
    # Browsers may send POST/PUT/PATCH/DELETE to the API only from this origin or a CORS origin above.
    # Builds are served from a sibling subdomain, so SameSite cookies alone do not stop cross-origin writes.
    origin: ${GMM_FRONTEND_ORIGIN:http://localhost:5173}
  session:
    cookie-name: GMM_SESSION
    cookie-secure: ${GMM_SESSION_COOKIE_SECURE:true}
    ttl: ${GMM_SESSION_TTL:14d}
  admin:
    # DataGSM account emails that are admins. Everyone else is a user; removing an email revokes admin.
    emails: ${GMM_ADMIN_EMAILS:}
  datagsm:
    client-id: ${DATAGSM_CLIENT_ID:}
    allowed-redirect-uris: ${DATAGSM_REDIRECT_URIS:http://localhost:5173/auth/callback}
    allow-teacher: ${DATAGSM_ALLOW_TEACHER:false}
  image:
    max-size: ${GMM_IMAGE_MAX_SIZE:5MB}
  build:
    root-dir: ${GMM_BUILD_ROOT_DIR:./data}
    public-base-url: ${GMM_BUILD_PUBLIC_BASE_URL:http://localhost:8081}
    max-zip-size: ${GMM_BUILD_MAX_ZIP_SIZE:200MB}
    max-extracted-size: ${GMM_BUILD_MAX_EXTRACTED_SIZE:500MB}
    max-file-count: ${GMM_BUILD_MAX_FILE_COUNT:2000}
