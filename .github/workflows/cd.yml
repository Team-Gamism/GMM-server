name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; never cancel one halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/team-gamism/gmm-server

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ktlint and unit tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: check
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha

  deploy:
    name: Deploy to school server
    needs: image
    # Runner on the school server, registered with the `gmm-prod` label. It connects out to
    # GitHub, so the school firewall needs no inbound port. Only this push-to-main job uses it.
    runs-on: [self-hosted, gmm-prod]
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Deploy
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMM_DEPLOY_DIR: ${{ vars.GMM_DEPLOY_DIR || '/srv/gmm' }}
        run: bash deploy/scripts/deploy.sh "${{ github.sha }}"
