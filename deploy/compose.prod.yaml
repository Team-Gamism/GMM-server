# Production stack on the school server. deploy/scripts/deploy.sh copies this file to
# $GMM_DEPLOY_DIR and runs it with IMAGE_TAG set and the server-only .env file.
name: gmm

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gmm}
      MYSQL_USER: ${MYSQL_USER:-gmm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No published port: only the api container reaches MySQL.

  api:
    image: ghcr.io/team-gamism/gmm-server:${IMAGE_TAG:?IMAGE_TAG is set by deploy.sh}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-gmm}
      DB_USERNAME: ${MYSQL_USER:-gmm}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DATAGSM_CLIENT_ID: ${DATAGSM_CLIENT_ID:?Set DATAGSM_CLIENT_ID in .env}
      DATAGSM_REDIRECT_URIS: ${DATAGSM_REDIRECT_URIS:?Set DATAGSM_REDIRECT_URIS in .env}
      DATAGSM_ALLOW_TEACHER: ${DATAGSM_ALLOW_TEACHER:-false}
      GMM_ADMIN_EMAILS: ${GMM_ADMIN_EMAILS:-}
      GMM_CORS_ALLOWED_ORIGINS: ${GMM_CORS_ALLOWED_ORIGINS:-}
      GMM_SESSION_COOKIE_SECURE: ${GMM_SESSION_COOKIE_SECURE:-true}
      GMM_BUILD_PUBLIC_BASE_URL: ${GMM_BUILD_PUBLIC_BASE_URL:?Set GMM_BUILD_PUBLIC_BASE_URL in .env}
      GMM_BUILD_ROOT_DIR: /data/gmm
      GMM_API_DOCS_ENABLED: ${GMM_API_DOCS_ENABLED:-false}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    volumes:
      - gmm-data:/data/gmm
    ports:
      # Loopback by default: put the school's reverse proxy (HTTPS) in front of it.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"

  builds:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      GMM_FRONTEND_ORIGIN: ${GMM_FRONTEND_ORIGIN:?Set GMM_FRONTEND_ORIGIN in .env}
    volumes:
      - gmm-data:/data/gmm:ro
      - ./nginx/builds.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${BUILDS_BIND:-127.0.0.1}:${BUILDS_PORT:-8081}:80"

volumes:
  mysql-data:
  gmm-data:
