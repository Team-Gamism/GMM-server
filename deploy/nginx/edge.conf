# Entry point on the school VM (profile "front"): serves the frontend build and forwards /api to Spring.
# The school HTTPS proxy terminates TLS and sends the frontend subdomain to this port.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Build zips go through here. Keep in sync with GMM_BUILD_MAX_REQUEST_SIZE.
  client_max_body_size 210m;

  # Security headers, owned by the frontend (GMM docs/deploy.md section 5). The sha256 is the inline theme script in
  # index.html; it changes when that script does. Report-Only until the site and Swagger UI show no violations.
  # add_header is not inherited by a location that has its own add_header, so those locations repeat these lines.
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-lSKn4rpvZfBHJEaeBaQb1cLvklxnEmK45yMGirkRyO4='; style-src 'self' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data: blob: https://gmm-games.https.gsmsv.site; frame-src https://gmm-games.https.gsmsv.site; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Build validation and extraction can take a while for large zips.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
  }

  # API docs (springdoc). Spring serves them only when GMM_API_DOCS_ENABLED=true; otherwise these return 404.
  location ~ ^/(swagger-ui\.html|swagger-ui/|v3/api-docs) {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Spring sends /swagger-ui.html → http://<host>/swagger-ui/index.html; keep only the path so the browser stays on HTTPS.
    proxy_redirect ~^https?://[^/]+(/.*)$ $1;
  }

  # Hashed assets never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-lSKn4rpvZfBHJEaeBaQb1cLvklxnEmK45yMGirkRyO4='; style-src 'self' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data: blob: https://gmm-games.https.gsmsv.site; frame-src https://gmm-games.https.gsmsv.site; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }

  # Single-page app: unknown paths fall back to index.html, which must not be cached.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-lSKn4rpvZfBHJEaeBaQb1cLvklxnEmK45yMGirkRyO4='; style-src 'self' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data: blob: https://gmm-games.https.gsmsv.site; frame-src https://gmm-games.https.gsmsv.site; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri /index.html;
  }
}
