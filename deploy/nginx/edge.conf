# Entry point on the school VM (profile "front"): serves the frontend build and forwards /api to Spring.
# The school HTTPS proxy terminates TLS and sends the frontend subdomain to this port.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Build zips go through here. Keep in sync with GMM_BUILD_MAX_REQUEST_SIZE.
  client_max_body_size 210m;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Build validation and extraction can take a while for large zips.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
  }

  # Hashed assets never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Single-page app: unknown paths fall back to index.html, which must not be cached.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
