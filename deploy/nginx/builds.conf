# Dedicated domain for Unity WebGL builds. It must be a different site from the GMM frontend and API,
# so uploaded scripts cannot reach GMM cookies. Mount the server's gmm.build.root-dir at /data/gmm.
# Never expose staging/.
server {
  listen 80;
  server_name _;  # Production: games.<build-only domain>

  root /data/gmm;
  default_type application/octet-stream;  # .data
  include /etc/nginx/mime.types;
  types {
    application/wasm wasm;
    text/javascript js;
  }

  # Builds are uploaded uncompressed, so compress them in transit.
  gzip on;
  gzip_types application/wasm text/javascript application/octet-stream application/json text/css;
  gzip_min_length 1024;

  location /builds/ {
    autoindex off;
    # Every upload gets a new path, so caching forever is safe.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    # Only the GMM frontend may embed builds. The nginx image fills ${GMM_FRONTEND_ORIGIN} from the
    # environment when it loads this file from /etc/nginx/templates/ (nginx variables like $uri stay as is).
    add_header Content-Security-Policy "frame-ancestors ${GMM_FRONTEND_ORIGIN}" always;
    try_files $uri =404;
  }

  # Uploaded icons, covers and avatars. The server writes only JPEG, PNG or WebP with a matching extension.
  location /images/ {
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}
