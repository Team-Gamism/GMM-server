# Dedicated domain for Unity WebGL builds. It must be a different site from the GMM frontend and API,
# so uploaded scripts cannot reach GMM cookies. Mount the server's gmm.build.root-dir at /data/gmm.
# Never expose staging/.

# Cache only successful responses. A 404 for a missing file must not be cached for a year:
# the same path can exist later (a build or image whose commit was still in flight).
map $status $gmm_asset_cache {
  ~^(200|206|304)$ "public, max-age=31536000, immutable";
  default "no-store";
}

map $status $gmm_page_cache {
  ~^(200|206|304)$ "no-cache";
  default "no-store";
}

server {
  listen 80;
  server_name _;  # Production: games.<build-only domain>

  root /data/gmm;
  default_type application/octet-stream;  # .data
  include /etc/nginx/mime.types;
  types {
    application/wasm wasm;
    text/javascript js;
  }

  # Builds are uploaded uncompressed, so compress them in transit.
  gzip on;
  gzip_types application/wasm text/javascript application/octet-stream application/json text/css;
  gzip_min_length 1024;

  location /builds/ {
    autoindex off;
    # Every upload gets a new path, so caching successful responses forever is safe.
    add_header Cache-Control $gmm_asset_cache always;
    add_header X-Content-Type-Options nosniff always;
    # Only the GMM frontend may embed builds. The nginx image fills ${GMM_FRONTEND_ORIGIN} from the
    # environment when it loads this file from /etc/nginx/templates/ (nginx variables like $uri stay as is).
    add_header Content-Security-Policy "frame-ancestors ${GMM_FRONTEND_ORIGIN}" always;
    try_files $uri =404;
  }

  # A build's entry page. Unity templates give the canvas a fixed size (Default also adds a footer), which
  # overflows the player iframe, so fit the canvas to the iframe; Unity then renders at that size.
  # Not immutable, so a later change to this style reaches builds that browsers already loaded.
  location ~ ^/builds/[^/]+/[^/]+/index\.html$ {
    add_header Cache-Control $gmm_page_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "frame-ancestors ${GMM_FRONTEND_ORIGIN}" always;
    sub_filter_once on;
    sub_filter '</head>' '<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#unity-container{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;transform:none!important}#unity-canvas{display:block;width:100%!important;height:100%!important}#unity-footer{display:none!important}</style></head>';
    try_files $uri =404;
  }

  # Uploaded icons, covers and avatars. The server writes only JPEG, PNG or WebP with a matching extension.
  location /images/ {
    autoindex off;
    add_header Cache-Control $gmm_asset_cache always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store" always;
    return 404;
  }
}
